version: '3.4'

services:  
  polly:
    build:
      context: ./clients/polly
    container_name: polly
    depends_on:
      - server
  
  resilience4j:
    build:
      context: ./clients/resilience4j
    container_name: resilience4j
    depends_on:
      - server

  cockatiel:
    build:
      context: ./clients/cockatiel
    container_name: cockatiel
    depends_on:
      - server

  scheduler:
    build: 
      context: ./scheduler
    container_name: scheduler
    volumes:
      - ./samples/config-all-delay.json:/opt/app/conf/conf.json
      - ./results:/opt/app/resilience-tests
      - envoy-logs:/opt/app/envoy-logs
    environment:
      - DISK_PATH=/opt/app/resilience-tests
      - CONFIG_FILE=/opt/app/conf/conf.json
      - ENVOY_ADMIN_URL=http://server:9901
      - ENVOY_ACCESS_LOG_PATH=/opt/app/envoy-logs/access.log
      - TIME_ZONE=America/Sao_Paulo
    depends_on:
      - resilience4j
      - polly
      - server

  server:
    build:
      context: server
    container_name: server
    ports:
      - 9901:9901
      - 9211:9211
    volumes:
      - envoy-logs:/var/log/envoy

volumes:
  envoy-logs:
