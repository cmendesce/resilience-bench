# Local override for running the temporal-fault smoke tests with Docker Compose.
# Use it on top of the repository's docker-compose.yaml, from the repository root:
#
#   TEST_CONFIG=configs/01-abort-single-window.json \
#     docker compose -f docker-compose.yaml -f tests/temporal-fault-test-kit/docker-compose.yaml \
#     up --build --abort-on-container-exit --exit-code-from scheduler scheduler
#
# Relative paths resolve against the repository root (the directory of the first compose file).
# Results are written to the local file system, so no AWS credentials or S3 bucket are needed.

services:
  scheduler:
    volumes:
      - ./tests/temporal-fault-test-kit/${TEST_CONFIG:-configs/01-abort-single-window.json}:/opt/app/conf/conf.json:ro
      - ./tests/temporal-fault-test-kit/results:/opt/app/resilience-tests
    environment:
      - DISK_PATH=/opt/app/resilience-tests
      - AWS_BUCKET_NAME=
      - AWS_OUTPUT_PATH=
